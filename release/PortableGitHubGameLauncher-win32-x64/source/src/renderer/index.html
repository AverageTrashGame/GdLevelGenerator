<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PortableGitHubGameLauncher</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <h1>PGGL</h1>
    <button data-page="home">Home</button>
    <button data-page="library">Installed</button>
    <button data-page="downloads">Downloads</button>
    <button data-page="settings">Settings</button>
  </aside>
  <main>
    <header>
      <input id="search" placeholder="Search title, tags, genre, developer">
      <select id="filterGenre"><option value="">All genres</option></select>
    </header>
    <section id="content"></section>
  </main>
</div>
<script src="renderer.js"></script>
</body>
</html>
